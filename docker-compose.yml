services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: netpulse-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: netpulse
      POSTGRES_DB: netpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: netpulse-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://netpulse:netpulse@postgres:5432/netpulse
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-netpulse-secret-change-in-production}
      CORS_ORIGIN: http://localhost:3000
      API_PORT: "4000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - snmpnet

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: netpulse-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

  snmpsim-router01:
    image: tandrup/snmpsim
    container_name: netpulse-snmpsim-router01
    restart: unless-stopped
    volumes:
      - ./snmpsim/devices/public:/usr/local/snmpsim/data
    networks:
      snmpnet:
        ipv4_address: 10.100.0.11

  snmpsim-router02:
    image: tandrup/snmpsim
    container_name: netpulse-snmpsim-router02
    restart: unless-stopped
    volumes:
      - ./snmpsim/devices/router02:/usr/local/snmpsim/data
    networks:
      snmpnet:
        ipv4_address: 10.100.0.12

  snmpsim-switch01:
    image: tandrup/snmpsim
    container_name: netpulse-snmpsim-switch01
    restart: unless-stopped
    volumes:
      - ./snmpsim/devices/switch01:/usr/local/snmpsim/data
    networks:
      snmpnet:
        ipv4_address: 10.100.0.13

  snmpsim-switch02:
    image: tandrup/snmpsim
    container_name: netpulse-snmpsim-switch02
    restart: unless-stopped
    volumes:
      - ./snmpsim/devices/switch02:/usr/local/snmpsim/data
    networks:
      snmpnet:
        ipv4_address: 10.100.0.14

  snmpsim-webserver01:
    image: tandrup/snmpsim
    container_name: netpulse-snmpsim-webserver01
    restart: unless-stopped
    volumes:
      - ./snmpsim/devices/webserver01:/usr/local/snmpsim/data
    networks:
      snmpnet:
        ipv4_address: 10.100.0.15

  snmpsim-dbserver01:
    image: tandrup/snmpsim
    container_name: netpulse-snmpsim-dbserver01
    restart: unless-stopped
    volumes:
      - ./snmpsim/devices/dbserver01:/usr/local/snmpsim/data
    networks:
      snmpnet:
        ipv4_address: 10.100.0.16

  snmpsim-firewall01:
    image: tandrup/snmpsim
    container_name: netpulse-snmpsim-firewall01
    restart: unless-stopped
    volumes:
      - ./snmpsim/devices/firewall01:/usr/local/snmpsim/data
    networks:
      snmpnet:
        ipv4_address: 10.100.0.17

  snmpsim-lb01:
    image: tandrup/snmpsim
    container_name: netpulse-snmpsim-lb01
    restart: unless-stopped
    volumes:
      - ./snmpsim/devices/lb01:/usr/local/snmpsim/data
    networks:
      snmpnet:
        ipv4_address: 10.100.0.18

volumes:
  pgdata:
  redisdata:

networks:
  snmpnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24
